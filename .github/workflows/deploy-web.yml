name: Site (versão web)

# Publica a versão web no GitHub Pages a partir de src/ (código compartilhado) + web/.
# Mudanças só no app Android (pasta android/) não disparam este deploy.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'supabase/config.json'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      APP_VERSION: 2.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Montar a versão web
        run: node scripts/build.mjs web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
