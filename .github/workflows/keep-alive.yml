name: Manter Supabase ativo

# Projetos gratuitos do Supabase pausam depois de 7 dias sem uso.
# Este workflow faz uma consulta leve duas vezes por semana.
# Usa o mesmo endereço e chave de supabase/config.json.
on:
  schedule:
    # Toda segunda e quinta às 09:00 UTC (06:00 no horário de Brasília)
    - cron: '0 9 * * 1,4'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar o banco para evitar pausa por inatividade
        run: |
          URL=$(jq -r '.url // ""' supabase/config.json | sed 's#/*$##')
          KEY=$(jq -r '.anonKey // ""' supabase/config.json)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Supabase ainda não configurado em supabase/config.json — nada a fazer."
            exit 0
          fi
          curl --fail --silent --show-error -X POST \
            -H "apikey: ${KEY}" \
            -H "Content-Type: application/json" \
            -d '{"p_code":"PING"}' \
            "${URL}/rest/v1/rpc/check_patrol_code"
          echo ""
          echo "Ping enviado com sucesso em $(date -u)."
